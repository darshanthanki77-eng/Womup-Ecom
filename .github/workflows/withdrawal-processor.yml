name: Withdrawal Processor

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  process-withdrawals:
    name: Monitor Pending Withdrawal Queue
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Pending Queue
        env:
          BACKEND_URL: ${{ secrets.BACKEND_API_URL || 'http://localhost:5001' }}
          ADMIN_KEY: ${{ secrets.ADMIN_SECRET_KEY || 'regal-super-admin-secret-2026' }}
        run: |
          curl -s "$BACKEND_URL/api/v1/withdrawals/all" \
            -H "x-admin-key: $ADMIN_KEY" || echo "Withdrawal queue checked."
